apiVersion: apps/v1
kind: Deployment

metadata:
  name: web

spec:

  selector:
    matchLabels:
      app: web
  
  template:
    metadata:
      labels:
        app: web
        environment: test
    spec:
      volumes:
        - name: credentials
          secret: 
            secretName: web-secret

      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          
          envFrom:
            - configMapRef:
                name: web-config
            - secretRef:
                name: web-secret

          volumeMounts:
            - name: credentials
              mountPath: /etc/secrets
              readOnly: true

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
          
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10