apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-helm-deployer-binding
  namespace: helm-demo
subjects:
  - kind: User
    name: github-helm-deployer
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: helm-deployer-role
  apiGroup: rbac.authorization.k8s.io
