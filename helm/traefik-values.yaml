deployment:
  replicas: 1
updateStrategy:
    type: Recreate
hostNetwork: false
ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik
ports:
  web:
    nodePort: 30081
    hostPort: 80
  websecure:
    nodePort: 30443
    hostPort: 443
service:
  spec:
    type: NodePort

providers:
  kubernetesIngress:
    nativeLBByDefault: true
