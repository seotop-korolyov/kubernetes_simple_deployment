deployment:
  replicas: 1

updateStrategy:
    type: Recreate

hostNetwork: false
ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik
ports:
  web:
    nodePort: 30081
    hostPort: 80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    nodePort: 30443
    hostPort: 443

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

service:
  spec:
    type: NodePort

providers:
  kubernetesIngress:
    nativeLBByDefault: true
